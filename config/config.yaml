# =============================================================
# Configuration du projet news-intell
# -------------------------------------------------------------
# Point d'entrée vers votre serveur LocalAI (conteneur Docker).
# Le conteneur « local-ai » est configuré ici :
#   docker run -p 8080:8080 localai/localai:latest
# =============================================================

# URL de base de l'API LocalAI (compatible OpenAI).
base_url: "http://localhost:8080"

# Clé d'API (facultatif si le serveur LocalAI n'exige pas d'auth).
api_key: ""

# Moteur de modèle :
#   - "localai"      : serveur LocalAI (API compatible OpenAI).
#   - "personnalise" : modèle local personnalisé chargé en mémoire (sans LocalAI).
backend: "localai"

# Si backend = "personnalise", indiquez votre modèle local (ex. GGUF) :
modele_personnalise:
  nom: "news-intell-expert"
  chemin: "/chemin/vers/mon-modele.gguf"

# Modèles utilisés (déjà chargés/nommés sur votre serveur).
modele_embedding: "hal-qwen3-embedding-0.6b"
modele_reranker: "jina-reranker-v1-base-en"

# Délai d'attente (en secondes) pour chaque appel au serveur.
# La génération de texte sur des modèles locaux peut être lente : augmentez
# cette valeur si nécessaire (voir le README).
timeout: 300

# Langue de travail (toutes les sorties sont produites dans cette langue).
langue: "fr"

# -------------------------------------------------------------
# Configuration des agents IA
# Chaque agent utilise un modèle précis et une température donnée.
# La clé « _defaut » sert de repli si un agent n'est pas listé.
# -------------------------------------------------------------
agents:
  _defaut:
    modele: "qwen3-4b"
    temperature: 0.2
  resume:
    modele: "qwen3-4b"
    temperature: 0.2
  classification:
    modele: "granite-4.2-3b-flash"
    temperature: 0.1
  sentiment:
    modele: "granite-4.2-3b-flash"
    temperature: 0.0
  entites:
    modele: "qwen3-1.7b"
    temperature: 0.1
  pertinence:
    modele: "granite-4.2-3b-flash"
    temperature: 0.0
  pnl_neuro:
    modele: "granite-4.2-3b-flash"
    temperature: 0.1
  pnl_noir:
    modele: "granite-4.2-3b-flash"
    temperature: 0.0
  analyste:
    modele: "granite-4.2-3b-flash"
    temperature: 0.3

# -------------------------------------------------------------
# Analyse comportementale (agents PNL neuro / noir) et travailleurs.
#   - pnl.active : active ou non l'analyse comportementale (PNL).
#   - nb_workers : nombre de travailleurs pour traiter les articles.
# -------------------------------------------------------------
pnl:
  active: true

nb_workers: 1

# -------------------------------------------------------------
# Analyse sémantique : déduplication et regroupement d'articles.
#   - dedupe.active : supprime les doublons sémantiques (embeddings).
#   - clustering.active : regroupe les articles par sujet (sémantique).
# -------------------------------------------------------------
dedupe:
  active: true
  seuil: 0.9

clustering:
  active: true
  seuil: 0.7

# -------------------------------------------------------------
# Sources d'actualité (flux RSS / Atom) à analyser.
# Adaptez librement cette liste selon vos centres d'intérêt.
# -------------------------------------------------------------
sources:
  - nom: "Le Monde"
    url: "https://www.lemonde.fr/rss/une.xml"
    limite: 15
  - nom: "France 24"
    url: "https://www.france24.com/fr/rss"
    limite: 12
  - nom: "France Info"
    url: "https://www.francetvinfo.fr/titres.rss"
    limite: 12
  - nom: "Le Figaro"
    url: "https://www.lefigaro.fr/rss/figaro_une.xml"
    limite: 12
  - nom: "RFI"
    url: "https://www.rfi.fr/fr/rss"
    limite: 12
  - nom: "Ouest-France"
    url: "https://www.ouest-france.fr/rss.xml"
    limite: 10
  - nom: "Sud Ouest"
    url: "https://www.sudouest.fr/rss.xml"
    limite: 10
  - nom: "Marianne"
    url: "https://www.marianne.net/rss"
    limite: 8

# -------------------------------------------------------------
# Seuils de sélection (utilisés pour filtrer / pondérer le rapport).
# -------------------------------------------------------------
seuils:
  pertinence_min: 0.5
