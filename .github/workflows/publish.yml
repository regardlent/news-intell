# Workflow de publication : déclenché lors d'un tag `v*`.
# Exécute les tests, construit le paquet et crée une release GitHub
# avec le paquet en pièce jointe (aucun secret requis pour cette partie).

name: Publication

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le dépôt
        uses: actions/checkout@v7

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances de construction
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Lancer les tests unitaires
        run: python -m unittest discover -s tests

      - name: Construire le paquet (wheel + archive)
        run: python -m build

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
