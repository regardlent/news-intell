# Configuration Dependabot : mises à jour automatiques des dépendances.
# Gère les dépendances Python et les actions GitHub.

version: 2
updates:
  # Dépendances Python (PyPI)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependabot"
      - "dépendances"

  # Actions GitHub (workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependabot"
      - "dépendances"
