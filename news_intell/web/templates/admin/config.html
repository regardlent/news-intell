{% extends "base.html" %}
{% block titre %}Configuration — news-intell{% endblock %}
{% block contenu %}
<h1>Configuration du projet</h1>
<p>Éditez la configuration au format <strong>YAML</strong> puis enregistrez. Les commentaires ne sont pas conservés à l'enregistrement.</p>
<textarea id="config" spellcheck="false">{{ texte }}</textarea>
<div class="admin-actions">
  <button id="btn-sauvegarder">Enregistrer</button>
  <a class="bouton" href="/admin">Retour</a>
</div>
<p id="statut-config"></p>
{% endblock %}
